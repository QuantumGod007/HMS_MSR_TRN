<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Appointment Transaction Entry</title>
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 16px;
            box-sizing: border-box;
        }

        .container {
            background-color: white;
            border: 1px solid #4b5563;
            border-radius: 12px;
            padding: 80px 55px;
            width: 95%;
            max-width: 1100px;
            min-height: 650px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .inner-card {
            background-color: #ede9fe;
            border: 1px solid #c4b5fd;
            border-radius: 10px;
            padding: 25px 30px;
            margin-top: 20px;
        }


        h1 {
            color: white;
            background-color: #7c3aed;
            padding: 10px 35px;
            border-radius: 8px;
            text-align: center;
            font-size: 22px;
            display: table;
            margin: 0 auto 10px auto;
            font-weight: 600;
        }



        h2 {

            color: white;
            background-color: #6d28d9;
            padding: 8px 32px;
            border-radius: 6px;
            text-align: center;
            font-size: 18px;
            display: table;
            margin: 0 auto 20px auto;
            font-weight: 500;
        }

        #form_msg {
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: green;
            margin-bottom: 5px;
            min-height: 18px;
        }




        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 40px;
        }

        form > div {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            width: 130px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .info-icon {
            color: #7c3aed;
            font-weight: normal;
            font-size: 12px;
            cursor: pointer;
        }

        input, select {
            width: 210px;
            padding: 6px 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 13px;
            background-color: white;
            outline: none;
            color: #1f2937;
            font-family: inherit;
        }

        select option:disabled {
            color: #9ca3af !important;
            background-color: #f3f4f6 !important;
            font-style: italic;
        }



        .w-short {
            width: 90px !important;
        }

        .w-long {
            width: 225px !important;
        }

        .w-medium {
            width: 150px !important;
        }

        .input-row {
            display: flex;
            align-items: center;
        }

        .w-id-row {
            width: 240px !important;
        }

        #appointment_id {
            width: 120px !important;
            flex: none !important;
        }

        input[readonly] {
            background-color: #f3f4f6;
            color: #4b5563;
            border-color: #e5e7eb;
            cursor: not-allowed;
        }

        #appointment_form.view-only input:not([type="hidden"]),
        #appointment_form.view-only select {
            background-color: #e5e7eb;
            color: #6b7280;
            cursor: not-allowed;
        }

        input:focus, select:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.15);
        }

        .required {
            color: red;
            margin-right: 2px;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 60px;
            padding-bottom: 10px;
        }

        .buttons-container button {
            padding: 7px 20px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }

        #save_btn {
            background-color: #10b981;
            color: white;
        }
        #save_btn:hover { background-color: #059669; }

        #prev_btn, #next_btn {
            background-color: #7c3aed;
            color: white;
            min-width: 80px;
        }
        #prev_btn:hover, #next_btn:hover { background-color: #6d28d9; }

        #exit_btn {
            background-color: #ef4444;
            color: white;
        }
        #exit_btn:hover { background-color: #dc2626; }

        .buttons-container button:disabled {
            background-color: #d1d5db !important;
            color: #9ca3af !important;
            cursor: not-allowed !important;
        }

        .find-new-group {
            display: flex;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #7c3aed;
            margin-left: 8px;
        }

        .find-new-group button {
            background-color: white;
            color: #7c3aed;
            border: none;
            padding: 5px 14px;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }

        .find-new-group button.active {
            background-color: #7c3aed !important;
            color: white !important;
        }

        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            background: white;
            border: 1px solid #7c3aed;
            border-radius: 6px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            width: 520px;
            margin-top: 4px;
        }
        .suggestion-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }
        .suggestion-table thead {
            position: sticky;
            top: 0;
            background-color: #f3f4f6;
            z-index: 10;
            border-bottom: 2px solid #7c3aed;
        }
        .suggestion-table th {
            padding: 8px 12px;
            font-weight: 700;
            color: #4b5563;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .suggestion-table td {
            padding: 8px 12px;
            color: #374151;
            border-bottom: 1px solid #e5e7eb;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .suggestion-table tr {
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .suggestion-table tbody tr:hover {
            background-color: #ede9fe;
        }
        .suggestion-table tbody tr:hover td {
            color: #7c3aed;
        }

        dialog {
            border: none;
            border-radius: 8px;
            padding: 25px;
            margin: auto;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            outline: none;
            width: 350px;
            font-family: inherit;
        }
        dialog::backdrop {
            background-color: rgba(0, 0, 0, 0.3);
        }
        .modal-content {
            text-align: center;
        }
        #modal_text {
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        #modal_close_btn {
            background-color: #7c3aed;
            color: white;
            padding: 7px 20px;
            border-radius: 6px;
            border: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        #modal_close_btn:hover { background-color: #6d28d9; }

        #unsaved_modal {
            border: none;
            border-radius: 12px;
            padding: 30px;
            width: 420px;
            font-family: inherit;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        #unsaved_modal h3 {
            font-size: 17px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 10px;
            text-align: center;
        }
        #unsaved_modal p {
            font-size: 14px;
            color: #4b5563;
            text-align: center;
            margin-bottom: 22px;
            line-height: 1.6;
        }
        .unsaved-btns {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        #unsaved_save_btn {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        #unsaved_save_btn:hover { background-color: #16a34a; }
        #unsaved_discard_btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        #unsaved_discard_btn:hover { background-color: #dc2626; }
        #unsaved_cancel_btn {
            background-color: #e5e7eb;
            color: #374151;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        #unsaved_cancel_btn:hover { background-color: #d1d5db; }

    </style>
</head>
<body>

    <div class="container">


        <h1>Hospital Management System</h1>
        <h2>Appointment Booking Entry</h2>
        <div id="form_msg"></div>

        <div class="inner-card">
            <form id="appointment_form" novalidate>

                <div>
                    <label for="appointment_id">Appointment ID:</label>
                    <div class="input-row w-id-row">
                        <input type="text" id="appointment_id" class="w-short" readonly>
                        <div class="find-new-group">

                            <button type="button" id="find_btn">Find</button>
                            <button type="button" id="new_btn" class="active">New</button>

                        </div>
                    </div>
                </div>

                <div style="position: relative;">
                    <label for="patient_search">Patient <span class="required">*</span> <span class="info-icon" data-help="Search and select patient from the master list.">ⓘ</span>:</label>
                    <input type="hidden" id="patient_sel">
                    <input type="text" id="patient_search" class="w-long" required autocomplete="off">
                    <div id="patient_suggestions" class="suggestions-list" style="display:none;"></div>
                </div>

                <div style="position: relative;">
                    <label for="doctor_search">Doctor <span class="required">*</span> <span class="info-icon" data-help="Search and select doctor by code, name or specialization.">ⓘ</span>:</label>
                    <input type="hidden" id="doctor_sel">
                    <input type="text" id="doctor_search" class="w-long" autocomplete="off">
                    <div id="doctor_suggestions" class="suggestions-list" style="display:none;"></div>
                </div>

                <div>
                    <label for="appt_date">Appointment Date <span class="required">*</span>:</label>
                    <input type="date" id="appt_date" class="w-medium" required>
                </div>

                <div>
                    <label for="appt_time">Appointment Time <span class="required">*</span>:</label>
                    <select id="appt_time" class="w-medium" required>
                    </select>
                </div>

                <div>
                    <label for="status">Status <span class="required">*</span>:</label>
                    <select id="status" class="w-medium" required>
                    </select>
                </div>

                <div></div>
                <div></div>

            </form>
        </div>


        <div class="buttons-container">
            <button type="button" id="save_btn">Save</button>
            <button type="button" id="prev_btn">Previous</button>
            <button type="button" id="next_btn">Next</button>
            <button type="button" id="exit_btn">Exit</button>
        </div>

    </div>

    <dialog id="custom_modal">
        <div class="modal-content">
            <p id="modal_text"></p>
            <button type="button" id="modal_close_btn">OK</button>
        </div>
    </dialog>

    <dialog id="unsaved_modal">
        <h3>Unsaved Changes</h3>
        <p>You have unsaved changes. Save before moving on?</p>
        <div class="unsaved-btns">
            <button type="button" id="unsaved_save_btn">Yes</button>
            <button type="button" id="unsaved_discard_btn">No</button>
            <button type="button" id="unsaved_cancel_btn">Cancel</button>
        </div>

    </dialog>

    <script src="appointment.js"></script>

</body>
</html>
